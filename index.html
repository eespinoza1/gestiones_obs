 {id:'P-01',n:'Resumen accionable de un boletín',et:'Vigilancia',tec:['Rol','Delimitadores','Salida estructurada','Anti-alucinación'],tool:'Claude',hitl:'H1: el humano verifica cada versión y acción contra la fuente.',v:'v3',

 {id:'P-02',n:'Triage contra el inventario',et:'Triage',tec:['Rol','Criterios ordenados','Salida estructurada','Auto-verificación'],tool:'Claude',hitl:'H2: AppSec aprueba prioridad y alcance antes de crear tickets.',v:'v3',
  txt:`Rol: Eres responsable de seguridad de aplicaciones (AppSec).

Datos:
- Reglas validadas de versiones entre <reglas></reglas>.

Tarea: Determina para cada activo si está afectado y su prioridad.

Criterios de prioridad, en este orden:
1. Exposición directa a internet de un servicio TCP en Linux.

4. Componentes de CI/CD.

// Fails the build if TLS certificate validation is disabled anywhere in lib/
import 'dart:io';
import 'package:test/test.dart';

void main() {
  test('no code disables TLS certificate validation', () {
    final offenders = Directory('lib')
        .listSync(recursive: true)
        .whereType<File>()
        .where((f) => f.path.endsWith('.dart'))
        .where((f) => f.readAsStringSync().contains('badCertificateCallback'));
    expect(offenders, isEmpty);
  });
}

<riesgo>{{DESCRIPCION_DEL_RIESGO}}</riesgo>

function assetEval(a){
  if(a.t==='linux'){
    const due=addDays(CASES[0].disc,a.exp==='internet'?P.slaP1:P.slaP2),prio=a.exp==='internet'?'P1':'P2';
    if(a.patched&&a.reboot)return {cat:'rem',st:'Remediado',prio,due,case:'C1',acts:['Verificar el kernel en ejecución y documentar la evidencia.']};
    if(a.patched&&!a.reboot)return {cat:'prog',st:'Parchado sin reiniciar: sigue vulnerable',prio,due,case:'C1',acts:['Reiniciar en ventana aprobada (H4); el parche no aplica hasta reiniciar.']};
    const lvl=a.exp==='internet'?(a.mptcp==='si'?'crítico':'alto'):'medio';
    const acts=[];
    if(a.distro==='Ubuntu')acts.push('Canonical no había publicado kernel corregido a la fecha del boletín: vigilar su aviso.');
    else if(a.distro==='Amazon Linux')acts.push('Actualizar el kernel (yum o dnf según la versión) y reiniciar.');
    else if(a.distro==='Bottlerocket')acts.push('Actualizar a la AMI de Bottlerocket v1.68.1.');
    else acts.push('Seguir la guía de la distribución y reiniciar.');
    if(/EKS/.test(a.plat))acts.push('Actualizar los nodos a la AMI optimizada de EKS v20261031 o posterior.');
    if(!a.interim&&a.exp!=='interna')acts.push('Mientras tanto: desactivar MPTCP (net.mptcp.enabled=0) y descartar paquetes IPv4 con opciones IP; no resuelve el problema.');
    if(a.exp==='lb')acts.push('Detrás de capas gestionadas de AWS la exposición baja, pero AWS recomienda parchar dentro de 30 días.');
    if(a.mptcp==='desconocido')acts.push('Confirmar si MPTCP está habilitado: con MPTCP se demostró ejecución remota de código.');
    return {cat:'aff',st:'Afectado · riesgo '+lvl+(a.interim?' (con medidas provisionales)':''),prio,due,case:'C1',acts};
  }
  const keys=TYPE_COMPS[a.t]||[];const res=keys.map(k=>({k,...evalComp(k,a.comp&&a.comp[k])}));
  const prio=a.t==='ci'?'P2':'P1',due=addDays(CASES[1].disc,prio==='P1'?P.slaP1:P.slaP2);
  if(res.some(r=>r.s==='aff')){return {cat:'aff',st:'Afectado',prio,due,case:'C2',res,acts:res.filter(r=>r.s==='aff').map(r=>'Actualizar '+CHECKS[r.k].n+' a '+CHECKS[r.k].fix+' o una versión de rama corregida. '+CHECKS[r.k].note).concat(a.t==='ci'?['Verificar que el pipeline descargue el plugin actualizado.']:['Recompilar, volver a publicar e impulsar la actualización de los usuarios.'])}}
  if(res.some(r=>r.s==='unk'||r.s==='bad'))return {cat:'ver',st:'Requiere verificación',prio,due,case:'C2',res,acts:res.filter(r=>r.s==='unk'||r.s==='bad').map(r=>CHECKS[r.k].n+': '+r.m)};
  if(res.every(r=>r.s==='na'))return {cat:'rem',st:'No usa componentes afectados',prio,due,case:'C2',res,acts:[]};
  if(a.t==='ci')return {cat:'rem',st:'Remediado',prio,due,case:'C2',res,acts:['No requiere volver a publicar la app.']};
  if(!a.pub)return {cat:'prog',st:'Corregido sin publicar',prio,due,case:'C2',res,acts:['Recompilar y publicar la nueva versión.']};
  const ad=a.adop===''?null:Number(a.adop);
  if(ad===null)return {cat:'prog',st:'Publicado; adopción sin datos',prio,due,case:'C2',res,acts:['Medir el porcentaje de usuarios en la versión corregida.']};
  if(ad<P.adopMin)return {cat:'prog',st:'Publicado; adopción '+ad+' %',prio,due,case:'C2',res,acts:['Impulsar la actualización: versión mínima forzada y notificación (meta '+P.adopMin+' %).']};
  return {cat:'rem',st:'Remediado (adopción '+ad+' %)',prio,due,case:'C2',res,acts:[]};
}
